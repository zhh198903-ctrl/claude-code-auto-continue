name: source-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Legacy checks
        run: |
          python test_parse.py
          python test_fable.py
          python test_gui_tick.py
          python test_local_api.py
          python test_selftrigger.py
          python test_updater.py
          python test_singleinstance.py
      - name: Codex checks
        run: python -m unittest test_cli_routing test_codex_activity test_codex_cli test_codex_gui test_codex_app test_codex_sessions test_codex_submission -v

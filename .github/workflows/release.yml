# Build Auto-Continue.exe on GitHub's infrastructure and attach it to a
# release — created because uploading a 26 MB asset from the dev machine's
# link is hopeless (connection resets at ~1.4 MB, 50+ failed attempts for
# v1.0.10). The source push is a few hundred KB; the runner does the rest.
#
# Usage:
#   gh workflow run release.yml -f tag=v1.0.10 -f publish=true
# The release (draft or published) must already exist for that tag.
name: build-release-exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the exe to"
        required: true
      publish:
        description: "Flip the draft to published after upload"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Verify APP_VERSION matches the tag
        # The updater compares version strings alone, so shipping an exe whose
        # APP_VERSION disagrees with its tag is silently unfixable: users on a
        # build carrying the same number never see the release as newer and
        # never update. Fail here rather than publish that.
        shell: python
        run: |
          import os, re, sys
          tag = os.environ["TAG"].lstrip("vV")
          src = open("auto_continue.py", encoding="utf-8").read()
          m = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', src, re.M)
          if not m:
              sys.exit("APP_VERSION not found in auto_continue.py")
          got = m.group(1)
          print(f"tag={tag!r}  APP_VERSION={got!r}")
          if got != tag:
              sys.exit(
                  f"APP_VERSION ({got}) != release tag ({tag}). Bump "
                  f"APP_VERSION in the release commit, then re-run.")
          print("version check OK")
        env:
          TAG: ${{ inputs.tag }}

      - name: Unit tests
        run: |
          python test_parse.py
          python test_gui_tick.py
          python test_updater.py
          python test_fable.py
          python test_singleinstance.py
          python test_selftrigger.py

      - name: Build onefile exe
        run: pyinstaller Auto-Continue.spec --clean --noconfirm

      - name: Report exe size
        run: Get-Item dist/Auto-Continue.exe | Select-Object Name,Length

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/Auto-Continue.exe --clobber

      - name: Publish draft
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --draft=false
